name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: |
            source/server/go.sum
            source/clients/cli/go.sum

      - name: Download CLI fixture build dependencies
        working-directory: source/clients/cli
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Launcher fixture suites
        run: |
          python3 scripts/test_launcher_compatibility.py
          python3 scripts/test_launcher_progress.py
          python3 scripts/test-launcher-arguments.py
          python3 scripts/test-launcher-feedback.py
          bash scripts/cercano-launcher_test.sh
          bash scripts/install-launcher_test.sh

      - name: Bounded ordinary launcher history smoke
        timeout-minutes: 10
        env:
          CERCANO_RUN_LAUNCHER_HISTORY_SMOKE: "1"
        run: go test ./cmd/cercano -run '^TestEverydayLauncherHistorySmoke$' -count=1 -timeout=9m

      - name: Build binary
        run: go build -ldflags "-X main.version=ci-${{ github.sha }}" -o bin/cercano ./cmd/cercano

      # The release workflow ships a Windows build, but this job only runs on
      # Linux. Cross-compile so Unix-only code is caught here, not at release.
      - name: Cross-compile for Windows and macOS
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./cmd/cercano
          GOOS=darwin GOARCH=arm64 go build ./...

  cli-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: |
            source/server/go.sum
            source/clients/cli/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Build cercano and cercano-cli
        run: ./scripts/build.sh

      - name: CLI unit tests
        working-directory: source/clients/cli
        run: go test ./... -count=1

      - name: Install tui-test
        run: npm ci

      - name: Run terminal end-to-end tests
        run: npm test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-traces
          path: test/e2e/artifacts/
          if-no-files-found: ignore
